<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta</title>
    <link rel="stylesheet" href="css/atualizar.css">
</head>
<body>

<div class="login-container">
    <h2>Atualizar Cadastro</h2>

    <!-- Formulário de atualização -->
    <form id="formAtualizar">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" readonly>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="senha">Nova senha (opcional):</label>
        <input type="password" id="senha" name="senha" minlength="6" placeholder="Deixe em branco para manter">

        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento">

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" title="Digite um número válido">

        <button type="submit" class="btn btn-login">Atualizar</button>
    </form>

    <!-- Botão de exclusão -->
    <button type="button" id="btnExcluir" class="btn btn-cadastro">Excluir Usuário</button>

    <h3>Minhas compras</h3>
    <ul id="minhasCompras" class="minhas-compras"><li>Carregando...</li></ul>

    <p><a href="produtos.html">← Voltar para Produtos</a> | <a href="#" onclick="sair(); return false;">Sair</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
