<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doce & Sabor - Cadastro</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

     <form class="form-container" id="formCadastro">
        <h1>Cadastro</h1>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Somente números" inputmode="numeric"
               pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Digite os 11 dígitos do CPF" required />

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" />

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" />

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required />

        <button type="submit">Cadastrar</button>

        <p class="link-login">Já tem conta? <a href="usu.html">Entrar</a></p>
      </form>

    <script src="js/api.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
