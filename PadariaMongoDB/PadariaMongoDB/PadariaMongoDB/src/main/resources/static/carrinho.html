<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - Padaria Doce & Sabor</title>
  <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="produtos.html" class="brand">Padaria Doce & Sabor</a>
      <nav class="nav">
        <ul>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="produtos.html#sobre">Sobre</a></li>
          <li><a href="produtos.html#contato">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>🛒 Seu Carrinho</h1>
      <p>Confira os itens selecionados e finalize sua compra.</p>
    </section>

    <section class="product-section">
      <h2>Itens no Carrinho</h2>
      <div id="itens" class="products-grid"></div>

      <div class="carrinho-footer">
        <h3>Total: <span id="total">R$ 0,00</span></h3>

        <div class="botoes-carrinho">
          <button onclick="voltarProdutos()" class="btn">← Voltar para Produtos</button>
          <button onclick="finalizarCompra()" class="btn btn-finalizar">Finalizar Compra</button>
          <button onclick="limparCarrinho()" class="btn btn-danger" id="limparCarrinhoBtn" style="display:none;">
            Limpar Carrinho
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="ano"></span> Padaria Doce & Sabor — Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/compra.js"></script>
</body>
</html>
