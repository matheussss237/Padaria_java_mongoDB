<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Padaria Doce & Sabor</title>
    <link rel="stylesheet" href="css/comp.css">
</head>
<body>

<!-- CHECKOUT -->
<div id="checkout">
    <h1>Finalizar Compra</h1>
    <div class="grid">
        <!-- Formulário -->
        <section class="card">
            <h2>Dados para Entrega</h2>
            <form id="checkoutForm">
                <label>Nome completo
                    <input type="text" id="nome" readonly>
                </label>
                <label>CPF
                    <input type="text" id="cpf" readonly>
                </label>
                <label>Endereço
                    <input type="text" id="endereco" required>
                </label>
                <label>Cidade
                    <input type="text" id="cidade" required>
                </label>
                <label>UF
                    <select id="uf" required>
                        <option value="">Selecione</option>
                        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                        <option>SP</option><option>SE</option><option>TO</option>
                    </select>
                </label>

                <h3>Pagamento</h3>
                <label class="opcao"><input type="radio" name="pagamento" value="cartao" checked> Cartão</label>
                <label class="opcao"><input type="radio" name="pagamento" value="pix"> Pix</label>
                <label class="opcao"><input type="radio" name="pagamento" value="boleto"> Boleto</label>

                <div class="botoes">
                    <button type="button" id="btnVoltar" class="btn">← Voltar para Carrinho</button>
                    <button type="submit" class="btn btn-finalizar">Finalizar Compra</button>
                </div>
            </form>
        </section>

        <!-- Resumo do Pedido -->
        <aside class="card">
            <h2>Resumo</h2>
            <ul id="resumo"></ul>
            <div class="total">
                Total: <span id="total">R$ 0,00</span>
            </div>
        </aside>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/compra.js"></script>
</body>
</html>
